name: PR Checks
on:
  - pull_request
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  actions: none
  attestations: none
  checks: none
  contents: read
  deployments: none
  id-token: none
  issues: none
  discussions: none
  packages: read
  pages: none
  pull-requests: none
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  check-cooldown-excludes:
    name: Cooldown exclude allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "26"

      - run: corepack enable
      - run: pnpm --version

      - name: Test the production cooldown guard (offline)
        run: node --test .github/tests/cooldown-guard.test.mjs

      - name: minimumReleaseAge is set in pnpm-workspace.yaml and its exclude list is @rvoh/* only
        run: |
          # SECURITY: the minimumReleaseAge cooldown bypass list must stay @rvoh/*
          # only (our own packages). Any third-party entry is a permanent
          # supply-chain bypass and must be rejected — apply urgent patches via a
          # transient, reverted override instead of a persistent exclude.
          #
          # pnpm 11+ reads the cooldown and its exclude list only from
          # pnpm-workspace.yaml. It ignores them in .npmrc, so a copy there (in
          # any key spelling) is rejected as misleading dead config.
          # This is the project's conservative tool floor, not the earliest
          # pnpm release that introduced each supply-chain setting. Verify the
          # running tool before asking it which policy it enforces.
          if ! version=$(pnpm --version); then
            echo "::error::could not determine running pnpm; stable pnpm >=12 is required"
            exit 1
          fi
          PNPM_VERSION="$version" node -e '
            const version = process.env.PNPM_VERSION
            const match = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.exec(version)
            if (!match || BigInt(match[1]) < 12n) {
              console.log("::error::stable pnpm >=12 is required to verify the cooldown policy")
              process.exit(1)
            }
          '
          stale=$(grep -niE "^[[:space:]]*[\"']?minimum[-_]?release[-_]?age" .npmrc | sed 's/^/.npmrc:/' || true)
          if [ -n "$stale" ]; then
            echo "::error::minimumReleaseAge settings in .npmrc are ignored by pnpm; set them in pnpm-workspace.yaml:"
            echo "$stale"
            exit 1
          fi
          if [ ! -f pnpm-workspace.yaml ]; then
            echo "::error::pnpm-workspace.yaml is missing; it must set the minimumReleaseAge cooldown"
            exit 1
          fi
          # Ask the pinned pnpm what it will enforce instead of pattern-matching
          # the yaml. pnpm loads the file with its own parser, so quoted keys,
          # flow lists, anchors and JSON-style mappings are read exactly as an
          # install reads them. A load error (duplicate key, wrong type) fails.
          if ! age=$(pnpm config get minimumReleaseAge --json); then
            echo "::error::pnpm could not load its configuration from pnpm-workspace.yaml"
            exit 1
          fi
          if ! excludes=$(pnpm config get minimumReleaseAgeExclude --json); then
            echo "::error::pnpm could not load its configuration from pnpm-workspace.yaml"
            exit 1
          fi
          if ! trust=$(pnpm config get trustLockfile --json); then
            echo "::error::pnpm could not load its configuration from pnpm-workspace.yaml"
            exit 1
          fi
          AGE="$age" EXCLUDES="$excludes" TRUST="$trust" node -e '
            const read = (name, raw) => {
              try {
                return JSON.parse(raw)
              } catch {
                console.log(`::error::could not read ${name} from pnpm config (got: ${raw || "nothing"})`)
                process.exit(1)
              }
            }
            const age = read("minimumReleaseAge", process.env.AGE)
            const excludes = read("minimumReleaseAgeExclude", process.env.EXCLUDES) ?? []
            const trust = read("trustLockfile", process.env.TRUST)
            let status = 0
            if (!Number.isInteger(age) || age < 4320) {
              console.log(`::error::pnpm-workspace.yaml must set an integer minimumReleaseAge >=4320 (the 3-day supply-chain cooldown); pnpm reads ${JSON.stringify(age)}`)
              status = 1
            }
            if (trust !== null && trust !== false) {
              console.log("::error::trustLockfile must be unset, null or false so pnpm verifies loaded lockfiles against the cooldown policy")
              status = 1
            }
            const list = Array.isArray(excludes) ? excludes : [excludes]
            const bad = list.filter(entry => typeof entry !== "string" || !entry.startsWith("@rvoh/"))
            if (bad.length > 0) {
              console.log("::error::Non-@rvoh minimumReleaseAgeExclude entries (cooldown bypass must stay @rvoh/* only):")
              for (const entry of bad) console.log(`pnpm-workspace.yaml: ${JSON.stringify(entry)}`)
              status = 1
            }
            process.exit(status)
          '

  tests:
    name: Unit tests (node ${{ matrix.node-version }}, postgres ${{ matrix.postgres-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - node-version: "24"
            postgres-version: "13"
            shard: 1
          - node-version: "24"
            postgres-version: "14"
            shard: 2
          - node-version: "26"
            postgres-version: "17"
            shard: 1
          - node-version: "26"
            postgres-version: "18"
            shard: 2
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}-alpine
        env:
          POSTGRES_USER: dream
          POSTGRES_DB: dream_test
          POSTGRES_PASSWORD: "postgres"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      postgresAlternateConnection:
        image: postgres:13-alpine
        env:
          POSTGRES_USER: dream
          POSTGRES_DB: dream_test_alternate
          POSTGRES_PASSWORD: "postgres"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

      mysql:
        image: mysql:8.0
        env:
          MYSQL_USER: dream
          MYSQL_DATABASE: dream_test_mysql
          MYSQL_PASSWORD: password
          MYSQL_ROOT_PASSWORD: password
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306

    env:
      NODE_ENV: test
      PORT: 7778
      DB_USER: dream
      MYSQL_DB_USER: root
      DB_USER_ROOT_MYSQL: root
      DB_NAME: dream_test
      ALTERNATE_DB_NAME: dream_test_alternate
      MYSQL_DB_NAME: dream_test_mysql
      DB_HOST: localhost
      MYSQL_DB_HOST: localhost
      REPLICA_DB_HOST: localhost
      REPLICA_DB_PORT: 5432
      DB_PASSWORD: postgres
      MYSQL_DB_PASSWORD: password
      DB_PORT: 5432
      ALTERNATE_DB_PORT: 5433
      MYSQL_DB_PORT: 3306
      TZ: UTC
      DREAM_PARALLEL_TESTS: 4
      APP_ENCRYPTION_KEY: ${{ vars.APP_ENCRYPTION_KEY }}
      LEGACY_APP_ENCRYPTION_KEY: ${{ vars.LEGACY_APP_ENCRYPTION_KEY }}
      COLUMN_ENCRYPTION_KEY: ${{ vars.APP_ENCRYPTION_KEY }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - run: corepack enable

      - if: ${{ steps.cache-node-modules.outputs.cache-hit != 'true' }}
        name: List the state of node modules
        continue-on-error: true
        run: pnpm list

      - run: pnpm install --frozen-lockfile
      - run: pnpm dream db:migrate --skip-sync
      - run: pnpm spec --shard=${{ matrix.shard }}/2

  linting:
    name: Linting
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "26"

      - run: corepack enable

      - if: ${{ steps.cache-node-modules.outputs.cache-hit != 'true' }}
        name: List the state of node modules
        continue-on-error: true
        run: pnpm list

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  check-build:
    name: Check build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "26"

      - run: corepack enable

      - if: ${{ steps.cache-node-modules.outputs.cache-hit != 'true' }}
        name: List the state of node modules
        continue-on-error: true
        run: pnpm list

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:test-app

  check-no-sync-diff:
    name: Ensure no sync diffs
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13-alpine
        env:
          POSTGRES_USER: dream
          POSTGRES_DB: dream_test
          POSTGRES_PASSWORD: "postgres"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      postgresAlternateConnection:
        image: postgres:13-alpine
        env:
          POSTGRES_USER: dream
          POSTGRES_DB: dream_test_alternate
          POSTGRES_PASSWORD: "postgres"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

      mysql:
        image: mysql:8.0
        env:
          MYSQL_USER: dream
          MYSQL_DATABASE: dream_test_mysql
          MYSQL_PASSWORD: password
          MYSQL_ROOT_PASSWORD: password
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306

    env:
      NODE_ENV: test
      PORT: 7778
      DB_USER: dream
      MYSQL_DB_USER: root
      DB_USER_ROOT_MYSQL: root
      DB_NAME: dream_test
      ALTERNATE_DB_NAME: dream_test_alternate
      MYSQL_DB_NAME: dream_test_mysql
      DB_HOST: localhost
      MYSQL_DB_HOST: localhost
      REPLICA_DB_HOST: localhost
      REPLICA_DB_PORT: 5432
      DB_PASSWORD: postgres
      MYSQL_DB_PASSWORD: password
      DB_PORT: 5432
      ALTERNATE_DB_PORT: 5433
      MYSQL_DB_PORT: 3306
      TZ: UTC
      DREAM_PARALLEL_TESTS: 4
      APP_ENCRYPTION_KEY: ${{ vars.APP_ENCRYPTION_KEY }}
      LEGACY_APP_ENCRYPTION_KEY: ${{ vars.LEGACY_APP_ENCRYPTION_KEY }}
      COLUMN_ENCRYPTION_KEY: ${{ vars.APP_ENCRYPTION_KEY }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm dream db:migrate --skip-sync
      - run: pnpm dream sync
      - name: Check for sync differences
        run: |
          if [ -n "$(git diff)" ]; then
            echo "Error: 'pnpm dream sync' produced changes. Please run 'pnpm dream sync' locally and commit the changes."
            echo "Changes detected:"
            git diff
            exit 1
          else
            echo "No changes detected after sync - all good!"
          fi

